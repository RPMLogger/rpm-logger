<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>inquiries layout</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>body{padding:30px 20px}.wrap{max-width:600px;margin:0 auto}</style>
</head><body><div class="wrap">
  <div class="section-label">Load</div>
  <div class="rpm-counts">
    <div class="rpm-count"><div class="rpm-count-n">23</div><div class="rpm-count-l">Students</div></div>
    <div class="rpm-count sub"><div class="rpm-count-n">11</div><div class="rpm-count-l">Weekly</div></div>
    <div class="rpm-count sub"><div class="rpm-count-n">12</div><div class="rpm-count-l">Biweekly</div></div>
    <div class="rpm-count lead"><div class="rpm-count-n">17</div><div class="rpm-count-l">Normalized</div></div>
  </div>
  <div class="section-label">Trial Lesson Inquiries</div>
  <div class="inq-dcard unread">
    <div class="inq-drow"><span class="inq-chan">Gmail</span><span class="inq-when">2 days ago</span></div>
    <div class="inq-name-line"><span class="inq-name">Jason Diller</span></div>
    <div class="inq-fields">
      <span class="inq-flabel">Date</span><span class="inq-fval">Sep 17, 2026</span>
      <span class="inq-flabel">City</span><span class="inq-fval">Jersey City</span>
      <span class="inq-flabel">Level</span><span class="inq-fval">Experienced Beginner</span>
    </div>
    <div class="inq-acts">
      <button class="inq-db yes">Yes</button>
      <button class="inq-db maybe opens-window">Maybe</button>
      <button class="inq-db no opens-window">No</button>
      <button class="inq-db">No reply</button>
      <button class="inq-db opens-window">Scam</button>
    </div>
  </div>
</div></body></html>
